interface:
  display_name: "downloadAll 视频下载"
  short_description: "说“下载这个”加 URL，即可探测并下载在线视频"
  default_prompt: "Use $download-all whenever I ask to check downloadAll readiness, the download environment, or its installation status. Run doctor and report readiness only when ready is true; otherwise return the missing dependencies and next action. Also use $download-all whenever I express download/save intent and provide an HTTPS URL, even when I do not say video. Treat phrases such as 下载这个, 保存这个, 把这个下载下来, and download this plus a URL as sufficient activation. Do not auto-download a bare URL without download intent, or requests for webpages, PDFs, images, uploads, summaries, or editing. For weixin.qq.com/sph links, use the bundled WeChat adapter through scripts/download.py. Prefer an already connected local backend. If the result is wechat_setup_required, run setup-wechat and follow its single next_action. If the result is manual_action_required, ask me once to manually reopen and play the video, then retry with --wait-page and finish automatically. Never use Computer Use, Accessibility, AppleScript, browser automation, or any other UI tool on WeChat. Use --wechat-online allowed only after explicit consent to send the public share URL to the fixed resolver. For other sites, download directly without upgrading first. If public extraction returns cookie_consent_required, ask for explicit consent and a browser choice before one cookie retry. Only after an extractor-related failure, run doctor without --upgrade; ask before doctor --upgrade and retry at most once. Before verification-prone sites, briefly state that no UI automation will be used and that login/CAPTCHA/security verification is manual. Keep playlists and overwrites disabled, require codec/media verification, and return absolute paths."
  examples:
    - "检查 downloadAll 是否准备完成"
    - "下载这个 X 视频：https://x.com/user/status/123"
    - "下载这个：https://v.douyin.com/example"
    - "保存这个 https://www.xiaohongshu.com/explore/example"
    - "把这个 B 站视频保存成 1080p"
    - "提取这个 YouTube 视频的 MP3"
    - "下载这个视频的中英文字幕"
    - "下载这个视频号：https://weixin.qq.com/sph/example"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
  activation:
    mode: "automatic-or-manual"
    paths: []
  execution:
    context: "local-machine"
    shell: "python3 plus yt-dlp, ffmpeg, ffprobe, and the bundled WeChat adapter"
  trust:
    source_tier: "local-installed-cli"
    remote_inline_execution: "forbid"
    browser_cookies: "public-first-explicit-consent-fallback"
    generated_public_claims: "evidence-bound"
    verification_prone_sites: "notice-then-url-only-no-ui-automation"
  permissions:
    network: "target media provider, official yt-dlp release API, locked WeChat backend release, and explicitly authorized fixed WeChat resolver"
    file_write: "user-selected output directory"
    subprocess: "yt-dlp, ffmpeg, ffprobe, embedded WeChat scripts, optional locked backend, and detected package manager for upgrades"
    interactive: "may be required by the OS when a browser cookie store is protected"
  degradation:
    no_network: "cannot inspect or download"
    no_ytdlp: "dependency error with installation guidance"
    no_ffmpeg: "metadata only; no verified media output"
    no_browser_cookie: "public resources only"
    provider_change: "upgrade yt-dlp and retry"
gates:
  governed:
    - "one public or user-authorized HTTPS media URL"
    - "no playlist and no overwrite"
    - "public-first cookie policy"
    - "ffprobe verification"
    - "absolute output paths"
    - "official stable yt-dlp update check"
    - "embedded WeChat Channels adapter without UI automation"
    - "explicit consent before sending a WeChat share URL to a fixed resolver"
    - "Xiaohongshu and verification-prone sites use no UI automation"
    - "manual-only login CAPTCHA and security verification"
